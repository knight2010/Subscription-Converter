name: Convert subscription and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate and decode input file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f input.txt ]; then
            echo "input.txt 不存在"
            exit 1
          fi

          if [ ! -s input.txt ]; then
            echo "input.txt 是空文件"
            exit 1
          fi

          # 先尝试直接识别原始订阅链接
          if ! grep -Eq '^[[:space:]]*(vmess|vless|ss|trojan|hysteria2)://' input.txt; then
            echo "未检测到直接节点链接，尝试 base64 订阅解码..."
            python - <<'PY'
import base64
import re
import sys
from pathlib import Path

p = Path("input.txt")
raw = p.read_text(encoding="utf-8", errors="ignore").strip()

if not raw:
    raise SystemExit("input.txt 为空")

# 去掉空白，兼容 base64 里有换行或空格的情况
payload = "".join(raw.split())

# 只在符合 base64 语法时尝试解码
if not re.fullmatch(r"[A-Za-z0-9+/=]+", payload):
    raise SystemExit("不是 base64 内容，且未发现支持的节点链接")

try:
    decoded = base64.b64decode(payload, validate=True)
except Exception as e:
    raise SystemExit(f"Base64 解码失败: {e}")

text = decoded.decode("utf-8", errors="ignore")

# 只接受解码后仍然是订阅链接内容
if not re.search(r"(vmess|vless|ss|trojan|hysteria2)://", text):
    raise SystemExit("Base64 解码后未发现支持的节点链接")

p.write_text(text, encoding="utf-8")
print("Base64 解码成功")
PY
          fi

          if ! grep -Eq '^[[:space:]]*(vmess|vless|ss|trojan|hysteria2)://' input.txt; then
            echo "input.txt 中没有找到支持的节点链接"
            echo "支持格式示例："
            echo "  vmess://..."
            echo "  vless://..."
            echo "  ss://..."
            echo "  trojan://..."
            echo "  hysteria2://..."
            echo "  或 base64 编码的订阅内容"
            exit 1
          fi

          echo "检测到支持的节点格式："
          grep -oE '^[[:space:]]*(vmess|vless|ss|trojan|hysteria2)://' input.txt \
            | sort | uniq -c

      - name: Convert nodes to YAML
        run: |
          python subscription_converter.py \
            input.txt \
            --file \
            --format clash \
            --template standard \
            --output converted.yaml

      - name: Check generated file
        run: |
          test -s converted.yaml
          echo "生成文件大小：$(du -h converted.yaml | cut -f1)"

      - name: Create GitHub Release and upload YAML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="subscription-$(date -u +'%Y%m%d-%H%M%S')"
          TITLE="Subscription $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          gh release create "$TAG" \
            converted.yaml \
            --title "$TITLE" \
            --notes "Automatically generated subscription configuration." \
            --latest
